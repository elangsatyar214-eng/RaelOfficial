<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 70" width="100" height="70">
  <!-- Clean High-Performance SVG Motorcycle (No defs to ensure safe canvas rendering) -->
  <!-- Handlebars -->
  <line x1="30" y1="20" x2="42" y2="35" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <rect x="24" y="16" width="16" height="5" rx="2" fill="#e2e8f0"/>
  <!-- Headlight -->
  <circle cx="25" cy="28" r="4" fill="#fef08a"/>
  <!-- Body Frame -->
  <polygon points="38,32 60,32 72,42 45,45" fill="#06b6d4"/>
  <!-- Seat -->
  <path d="M52 30 Q65 28 72 34" stroke="#000" stroke-width="5" stroke-linecap="round"/>
  <!-- Exhaust Pipe -->
  <line x1="48" y1="50" x2="80" y2="52" stroke="#64748b" stroke-width="4"/>
  <!-- Front Wheel -->
  <circle cx="28" cy="52" r="13" fill="#09090b" stroke="#71717a" stroke-width="3"/>
  <circle cx="28" cy="52" r="4" fill="#06b6d4"/>
  <!-- Rear Wheel -->
  <circle cx="78" cy="52" r="13" fill="#09090b" stroke="#71717a" stroke-width="3"/>
  <circle cx="78" cy="52" r="4" fill="#06b6d4"/>
</svg>
