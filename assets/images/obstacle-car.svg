  <path d="M30 30 L45 10 L85 10 L100 30 Z" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <rect x="48" y="14" width="18" height="13" fill="#38bdf8" opacity="0.8"/>
  <rect x="70" y="14" width="18" height="13" fill="#38bdf8" opacity="0.8"/>
  <!-- Car Body -->
  <rect x="10" y="30" width="100" height="24" rx="4" fill="#f59e0b"/>
  <!-- Headlights -->
  <rect x="10" y="36" width="6" height="8" rx="2" fill="#fef08a"/>
  <!-- Wheels -->
  <circle cx="32" cy="54" r="12" fill="#09090b" stroke="#71717a" stroke-width="3"/>
  <circle cx="32" cy="54" r="5" fill="#f59e0b"/>
  <circle cx="88" cy="54" r="12" fill="#09090b" stroke="#71717a" stroke-width="3"/>
  <circle cx="88" cy="54" r="5" fill="#f59e0b"/>
  <!-- Warning Stripes -->
  <line x1="16" y1="46" x2="22" y2="52" stroke="#000" stroke-width="2"/>
  <line x1="24" y1="46" x2="30" y2="52" stroke="#000" stroke-width="2"/>
</svg>
